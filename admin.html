<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add video | Zavin Edits</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<nav><div class="wrap"><a class="logo" href="index.html">Zavin<i>.</i>Edits</a></div></nav>
<main class="wrap" style="padding-top:40px"><div class="box">
<h2 style="font-size:32px">Add a video</h2>
<div class="note">GitHub Pages has no server, so this page makes the line to paste into <b>videos.json</b>. Only you can edit that file (it needs your GitHub login).</div>
<label for="title">Title</label><input id="title">
<label for="cat">Category</label><input id="cat" placeholder="Reels, Vlog, Promo…">
<label for="desc">Short description</label><input id="desc">
<label for="src">YouTube link <small>(unlisted is fine)</small> or file path like <small>videos/edit1.mp4</small></label><input id="src">
<p style="margin-top:16px"><button class="btn" id="mk">Make line</button></p>
<pre id="out" hidden></pre><p class="msg" id="m"></p>
<p style="color:var(--mute);margin-top:12px;font-size:15px">Then: GitHub → videos.json → ✏️ edit → paste the line inside the [ ] (put a comma between lines) → Commit.</p>
</div></main>
<script>
const $=id=>document.getElementById(id);
$('mk').onclick=()=>{
  const s=$('src').value.trim(),o={title:$('title').value||'Untitled',category:$('cat').value||'General',description:$('desc').value,date:new Date().toISOString().slice(0,10)};
  const y=s.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  if(y)o.youtube=y[1];else if(s)o.file=s;else{$('m').textContent='Add a YouTube link or file path.';$('m').className='msg err';return}
  const t=JSON.stringify(o);$('out').textContent=t;$('out').hidden=false;
  navigator.clipboard?.writeText(t).then(()=>{$('m').textContent='Copied.';$('m').className='msg ok'},()=>{})};
</script></body></html>
